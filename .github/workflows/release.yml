name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: platform-mesh/.github/.github/workflows/job-node-test.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    secrets: inherit # zizmor: ignore[secrets-inherit]

  create-version:
    uses: platform-mesh/.github/.github/workflows/job-create-version.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write # Needed to create the GitHub release for the tag

  docker-build-push:
    needs: [create-version, test]
    uses: platform-mesh/.github/.github/workflows/job-docker-build-push.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write # Needed to create the GitHub release for the tag
      packages: write # Needed to push the versioned image to GHCR
      id-token: write # Needed for keyless (OIDC) cosign signing
    with:
      imageTagName: ghcr.io/platform-mesh/iam-ui
      version: ${{ needs.create-version.outputs.version }}
      multiarch: true

  update-version:
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-chart-version-update.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      appVersion: ${{ needs.create-version.outputs.version }}
      chart: iam-ui
      targetRepository: platform-mesh/helm-charts

  sbom:
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    permissions:
      contents: read # Needed for actions/checkout in the reusable
      packages: read # Needed to pull the image to scan
    with:
      imageReference: ghcr.io/platform-mesh/iam-ui:${{ needs.create-version.outputs.version }}

  image-ocm:
    needs: [create-version, docker-build-push, sbom]
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read # Needed for actions/checkout in the reusable
      packages: write # Needed to push the OCM component to GHCR
    with:
      imageReference: ghcr.io/platform-mesh/iam-ui:${{ needs.create-version.outputs.version }}
      appVersion: ${{ needs.create-version.outputs.version }}
      repoName: iam-ui
      commit: ${{ github.sha }}

  scan-sbom:
    needs: [create-version, docker-build-push, sbom, image-ocm]
    uses: platform-mesh/.github/.github/workflows/job-trivy-sbom.yml@a22e08a90be540bb7de3119310bdc8b767c887fb # main
    permissions:
      contents: read # Needed for actions/checkout in the reusable
      packages: read # Needed to pull the image to scan
      security-events: write # Needed to upload Trivy results to code scanning
    with:
      componentVersion: ${{ needs.create-version.outputs.version }}
